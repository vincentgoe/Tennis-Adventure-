<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <!--
      Scene view for Plot Twist (specs/point-and-click.md, specs/scene-polish.md).

      Shows the scene SVG with clickable hotspots and name labels, plays short
      animations (walk to a spot, drop an element), and shows the last message:
      speech in a bubble above the speaker, narration and object texts in the
      text box. When a hotspot is clicked it reports {action, nonce} back to
      Python. It knows nothing about the rules: Python decides which hotspots
      exist, whether they are allowed, what a click does and what the message
      is. Talks to Streamlit with its plain postMessage protocol, so no build
      step or extra package is needed.
    -->
    <style>
      html, body { margin: 0; padding: 0; background: transparent; overflow: hidden; }
      #wrap { position: relative; width: 100%; user-select: none; }
      #scene svg { display: block; width: 100%; height: auto; border-radius: 4px; }
      #overlay { position: absolute; inset: 0; width: 100%; height: 100%; }

      /* Hotspots are invisible; their labels show what can be clicked */
      .spot { fill: transparent; stroke: none; cursor: pointer; }
      .label rect { fill: rgba(45, 58, 42, 0.82); transition: fill 0.12s; }
      .label text { fill: #ffffff; font: bold 7px monospace; }
      /* Names appear only while hovering (author feedback) */
      .label { pointer-events: none; opacity: 0; transition: opacity 0.15s; }
      .label.hot { opacity: 1; }
      .busy .label, .busy .exit-badge, .busy .exit-arrow,
      .talking .label, .talking .exit-badge, .talking .exit-arrow { opacity: 0; }

      .exit-badge { fill: rgba(45, 58, 42, 0.8); pointer-events: none; transition: fill 0.12s, opacity 0.2s; }
      .exit-badge.hot { fill: #d9743a; }
      .exit-arrow { fill: #ffffff; font: bold 12px monospace; pointer-events: none; transition: opacity 0.2s; }

      #menu { position: absolute; display: none; min-width: 160px; z-index: 5;
              background: #fbf7ee; border: 2px solid #2d3a2a; border-radius: 4px;
              padding: 4px; box-shadow: 0 2px 8px rgba(0, 0, 0, 0.35); }
      #menu button { display: block; width: 100%; margin: 3px 0; padding: 7px 10px;
                     font: 600 13px monospace; text-align: left; cursor: pointer;
                     color: #ffffff; background: #d9743a; border: 0; border-radius: 3px; }
      #menu button:hover { background: #c4642f; }

      /* Item reveal: darkened scene, turning light rays, a slowly spinning item */
      #reveal { position: absolute; inset: 0; z-index: 2; display: none; overflow: hidden;
                background: radial-gradient(circle at 50% 42%, rgba(60, 45, 15, 0.55), rgba(0, 0, 0, 0.88)); }
      #rays { position: absolute; left: 50%; top: 40%; width: 150%; aspect-ratio: 1;
              border-radius: 50%; animation: rays 24s linear infinite;
              background: repeating-conic-gradient(rgba(255, 228, 140, 0.16) 0deg 9deg, transparent 9deg 18deg); }
      @keyframes rays { from { transform: translate(-50%, -50%) rotate(0deg); }
                        to   { transform: translate(-50%, -50%) rotate(360deg); } }
      #item { position: absolute; left: 50%; top: 40%; height: 68%; transform: translate(-50%, -50%);
              perspective: 700px; }
      #item .spinner { height: 100%; animation: turn 8s linear infinite; }
      #item svg { height: 100%; width: auto; aspect-ratio: 120 / 210; display: block;
                  filter: drop-shadow(0 0 10px rgba(255, 220, 120, 0.85)); }
      @keyframes turn { from { transform: rotateY(0deg); } to { transform: rotateY(360deg); } }

      /* While a conversation runs, a click anywhere moves it on */
      #catcher { position: absolute; inset: 0; z-index: 2; display: none; cursor: pointer; }

      /* Game-style text: Press Start 2P (SIL Open Font License, see
         PressStart2P-OFL.txt), stored locally so the game works offline */
      @font-face { font-family: "GameFont"; src: url("PressStart2P-Regular.ttf") format("truetype"); }
      .game-text { font-family: "GameFont", "Courier New", monospace; letter-spacing: 0.5px; }

      /* Text box at the bottom of the image (narration, objects) */
      #dialog { position: absolute; left: 8px; right: 8px; bottom: 8px; z-index: 3;
                display: none; cursor: pointer;
                background: rgba(12, 12, 12, 0.94); color: #ffffff;
                border: 3px solid #fbf7ee; border-radius: 4px;
                box-shadow: 0 0 0 3px #111111;
                padding: 16px 18px 14px; font-size: 11px; line-height: 2; }
      #speaker { position: absolute; top: -14px; left: 12px; display: none;
                 background: #d9743a; color: #ffffff; border: 2px solid #fbf7ee;
                 border-radius: 3px; padding: 3px 8px; font-size: 9px; }

      /* Speech bubble above the speaker */
      #bubble { position: absolute; z-index: 3; display: none; cursor: pointer;
                max-width: 58%; transform: translate(-50%, -100%);
                background: #111111; color: #ffffff; border: 3px solid #fbf7ee;
                border-radius: 8px; padding: 8px 12px 14px;
                font-size: 11px; line-height: 1.9; box-shadow: 0 0 0 2px #111111; }
      #bubble::after, #bubble::before { content: ""; position: absolute; left: var(--tail, 50%);
                transform: translateX(-50%); border-style: solid; }
      #bubble::before { bottom: -15px; border-width: 13px 9px 0 9px;
                border-color: #fbf7ee transparent transparent transparent; }
      #bubble::after { bottom: -10px; border-width: 10px 6px 0 6px;
                border-color: #111111 transparent transparent transparent; }
      #bubble-name { font-size: 9px; color: #f0a46e; margin-bottom: 4px; }

      .more { position: absolute; right: 10px; bottom: 3px; font: bold 11px monospace;
              color: #d9743a; animation: blink 0.9s steps(2, start) infinite; display: none; }
      @keyframes blink { to { visibility: hidden; } }
      .walking #player .hop { animation: hop 0.28s ease-in-out infinite; }
      @keyframes hop { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-2px); } }
    </style>
  </head>
  <body>
    <div id="wrap">
      <div id="scene"></div>
      <svg id="overlay" xmlns="http://www.w3.org/2000/svg"></svg>
      <div id="menu"></div>
      <div id="reveal"><div id="rays"></div><div id="item"><div class="spinner"></div></div></div>
      <div id="catcher"></div>
      <div id="dialog" class="game-text"><div id="speaker"></div><div id="dialog-text"></div><div class="more">▼</div></div>
      <div id="bubble" class="game-text"><div id="bubble-name"></div><div id="bubble-text"></div><div class="more">▼</div></div>
    </div>

    <script>
      const SVG_NS = "http://www.w3.org/2000/svg";
      const TYPE_DELAY_MS = 22;
      const $ = id => document.getElementById(id);
      const wrap = $("wrap"), scene = $("scene"), overlay = $("overlay"), menu = $("menu");
      const catcher = $("catcher"), dialog = $("dialog"), bubble = $("bubble");

      let args = null;          // last render arguments from Python
      let lastScene = "";
      let shownMessageId = null;
      let busy = false;         // an animation is playing: ignore clicks
      let conversation = null;  // {pieces, index, typing}

      // --- Streamlit protocol ------------------------------------------------
      function send(type, data) {
        window.parent.postMessage(
          Object.assign({ isStreamlitMessage: true, type: type }, data), "*");
      }
      function report(actionId, player) {
        hideMenu();
        send("streamlit:setComponentValue", {
          value: { action: actionId, nonce: Date.now() + Math.random(), player: player || null },
          dataType: "json",
        });
      }
      function updateHeight() {
        send("streamlit:setFrameHeight", { height: wrap.offsetHeight });
      }
      const units = () => wrap.offsetWidth / args.width;   // pixels per SVG unit

      // --- Menu for hotspots with several actions ------------------------------
      function pointIn(event) {
        const box = wrap.getBoundingClientRect();
        return { x: event.clientX - box.left, y: event.clientY - box.top };
      }
      function hideMenu() { menu.style.display = "none"; }
      function showMenu(event, group) {
        menu.innerHTML = "";
        group.forEach(spot => {
          const button = document.createElement("button");
          button.textContent = spot.label;
          button.addEventListener("click", e => { e.stopPropagation(); activate(spot); });
          menu.appendChild(button);
        });
        menu.style.display = "block";
        const p = pointIn(event);
        const left = Math.min(Math.max(p.x - menu.offsetWidth / 2, 4),
                              wrap.offsetWidth - menu.offsetWidth - 4);
        const top = Math.min(p.y + 8, wrap.offsetHeight - menu.offsetHeight - 4);
        menu.style.left = left + "px";
        menu.style.top = Math.max(top, 4) + "px";
      }
      wrap.addEventListener("click", hideMenu);

      // --- Animations before an action -----------------------------------------
      const wait = ms => new Promise(resolve => setTimeout(resolve, ms));

      // Where the player walks to for this spot: its walk_to (only if the
      // action is allowed); otherwise next to the spot, on the side the player
      // comes from, on the same ground line. In front of something wide (e.g.
      // the lockers) the player already is "there" and stays.
      function walkTarget(spot) {
        const p = args.player;
        if (spot.allowed && spot.walk_to) return { x: spot.walk_to[0], y: spot.walk_to[1] };
        const width = 22 * p.scale;
        const center = p.x + width / 2;
        const inside = center >= spot.x && center <= spot.x + spot.w;
        if (inside && spot.w >= 2 * width) return { x: p.x, y: p.y };
        const fromRight = center > spot.x + spot.w / 2;
        let x = fromRight ? spot.x + spot.w + 1 : spot.x - width - 1;
        x = Math.min(Math.max(x, 0), args.width - width);
        return { x: x, y: p.y };
      }

      async function activate(spot) {
        if (busy) return;
        hideMenu();
        const player = scene.querySelector("#player");
        let reached = null;
        busy = true;
        wrap.classList.add("busy");
        endConversation();
        if (player && args.player) {
          reached = walkTarget(spot);
          const dx = reached.x - args.player.x, dy = reached.y - args.player.y;
          const distance = Math.hypot(dx, dy);
          if (distance > 3) {
            const seconds = Math.min(Math.max(distance / 140, 0.3), 1.3);
            wrap.classList.add("walking");
            player.style.transition = `transform ${seconds}s linear`;
            player.style.transform = `translate(${dx}px, ${dy}px)`;
            await wait(seconds * 1000 + 80);
            wrap.classList.remove("walking");
          }
        }
        // Only allowed actions play their extra animation (e.g. the falling lock)
        if (spot.allowed && spot.drop) {
          const target = scene.querySelector("#" + CSS.escape(spot.drop));
          if (target) {
            target.style.transformBox = "fill-box";
            target.style.transformOrigin = "center";
            target.style.transition = "transform 0.6s cubic-bezier(.5,0,1,1), opacity 0.6s";
            target.style.transform = "translate(0px, 46px) rotate(35deg)";
            target.style.opacity = "0";
            await wait(750);
          }
        }
        busy = false;
        wrap.classList.remove("busy");
        report(spot.id, reached);
      }

      // --- Typing text ---------------------------------------------------------
      // Split "*word*" into italic segments; everything else is plain text.
      function segments(text) {
        return text.split(/(\*[^*]+\*)/).filter(Boolean).map(part =>
          part.startsWith("*") && part.endsWith("*")
            ? { text: part.slice(1, -1), em: true }
            : { text: part, em: false });
      }

      // Write text into `target`. Letter by letter if `animate`, based on
      // elapsed time so it catches up when the browser slows timers down.
      // Returns {finish, done} to control it.
      function typeText(target, text, animate, onDone) {
        target.innerHTML = "";
        const parts = segments(text).map(seg => {
          const span = document.createElement(seg.em ? "em" : "span");
          span.style.whiteSpace = "pre-wrap";
          target.appendChild(span);
          return { span: span, text: seg.text };
        });
        const show = count => {
          let left = count;
          parts.forEach(p => { p.span.textContent = p.text.slice(0, Math.max(0, left)); left -= p.text.length; });
        };
        const full = parts.map(p => p.text).join("");
        const state = { done: false, timer: null };
        state.finish = () => { clearTimeout(state.timer); show(full.length); state.done = true; onDone(); };
        if (!animate) { state.finish(); return state; }

        const showAt = [];
        let t = 0;
        for (const ch of full) {
          showAt.push(t);
          t += ".!?".includes(ch) ? TYPE_DELAY_MS * 8 : TYPE_DELAY_MS;
        }
        const start = performance.now();
        const step = () => {
          const elapsed = performance.now() - start;
          let count = 0;
          while (count < showAt.length && showAt[count] <= elapsed) count += 1;
          show(count);
          if (count >= full.length) { state.done = true; onDone(); return; }
          state.timer = setTimeout(step, TYPE_DELAY_MS);
        };
        step();
        return state;
      }

      // --- Conversation: pieces of narration (box) and speech (bubble) ----------
      // Text between double quotes is speech, the rest is narration.
      function splitSpeech(text) {
        return text.split('"').map((part, i) => ({ text: part.trim(), speech: i % 2 === 1 }))
                   .filter(piece => piece.text.length > 0);
      }

      function endConversation() {
        if (conversation && conversation.typing) clearTimeout(conversation.typing.timer);
        conversation = null;
        wrap.classList.remove("talking");
        $("reveal").style.display = "none";
        dialog.style.display = "none";
        bubble.style.display = "none";
        catcher.style.display = "none";
      }

      function placeBubble(anchor) {
        const u = units();
        bubble.style.display = "block";
        const half = bubble.offsetWidth / 2;
        const wantX = anchor[0] * u;
        const x = Math.min(Math.max(wantX, half + 4), wrap.offsetWidth - half - 4);
        bubble.style.left = x + "px";
        bubble.style.top = (anchor[1] * u - 14) + "px";
        // Keep the tail pointing at the speaker even when the bubble is moved
        bubble.style.setProperty("--tail", (half + wantX - x) + "px");
      }

      function showPiece() {
        const c = conversation;
        const piece = c.pieces[c.index];
        document.querySelectorAll(".more").forEach(el => (el.style.display = "none"));
        const markDone = box => () => { box.querySelector(".more").style.display = "block"; };

        if (piece.speech && c.anchor) {
          dialog.style.display = "none";
          $("bubble-name").textContent = c.speaker || "";
          $("bubble-name").style.display = c.speaker ? "block" : "none";
          $("bubble-text").textContent = piece.text;      // measure the full size first
          placeBubble(c.anchor);
          c.typing = typeText($("bubble-text"), piece.text, true, markDone(bubble));
        } else {
          bubble.style.display = "none";
          // Spoken without a bubble (e.g. the steward): name tag + letter by letter
          const spoken = piece.speech || (c.speaker && !c.anchor);
          $("speaker").textContent = c.speaker || "";
          $("speaker").style.display = spoken && c.speaker ? "block" : "none";
          dialog.style.display = "block";
          const text = piece.speech && !c.anchor ? `"${piece.text}"` : piece.text;
          c.typing = typeText($("dialog-text"), text, Boolean(spoken), markDone(dialog));
        }
      }

      function advance(event) {
        if (event) event.stopPropagation();
        const c = conversation;
        if (!c) return;
        if (c.typing && !c.typing.done) { c.typing.finish(); return; }   // show the full piece
        c.index += 1;
        if (c.index >= c.pieces.length) endConversation(); else showPiece();
      }
      [catcher, dialog, bubble].forEach(el => el.addEventListener("click", advance));

      function startConversation(message) {
        endConversation();
        let pieces;
        if (message.anchor) {
          pieces = splitSpeech(message.text);                 // narration and speech in turns
        } else {
          pieces = [{ text: message.text, speech: false }];   // one piece in the text box
        }
        if (!pieces.length) return;
        conversation = { pieces: pieces, index: 0, typing: null,
                         speaker: message.speaker, anchor: message.anchor };
        catcher.style.display = "block";
        wrap.classList.add("talking");
        if (message.closeup_svg) {           // item reveal behind the text box
          document.querySelector("#item .spinner").innerHTML = message.closeup_svg;
          $("reveal").style.display = "block";
        }
        showPiece();
      }

      // --- Drawing the scene ---------------------------------------------------
      function el(name, attrs) {
        const node = document.createElementNS(SVG_NS, name);
        for (const key in attrs) node.setAttribute(key, attrs[key]);
        return node;
      }

      function addLabel(spot, width) {
        const g = el("g", { class: "label" });
        const text = el("text", { "text-anchor": "middle" });
        text.textContent = spot.name;
        g.appendChild(text);
        overlay.appendChild(g);

        // Default: centred above the hotspot; inside it if there is no room
        let [cx, cy] = spot.label_at || [spot.x + spot.w / 2, spot.y - 4];
        if (!spot.label_at && cy < 10) cy = spot.y + 10;
        const boxW = text.getComputedTextLength() + 6, boxH = 10;
        cx = Math.min(Math.max(cx, boxW / 2 + 2), width - boxW / 2 - 2);
        text.setAttribute("x", cx);
        text.setAttribute("y", cy);
        g.insertBefore(el("rect", {
          x: cx - boxW / 2, y: cy - boxH + 2.5, width: boxW, height: boxH, rx: 2 }), text);
        return g;
      }

      function drawScene() {
        hideMenu();
        wrap.classList.remove("busy");
        busy = false;
        scene.innerHTML = args.svg;
        overlay.setAttribute("viewBox", `0 0 ${args.width} ${args.height}`);
        overlay.innerHTML = "";

        // Actions that share a rectangle open one menu together
        const groups = new Map();
        args.hotspots.forEach(spot => {
          const rectKey = [spot.x, spot.y, spot.w, spot.h].join(",");
          if (!groups.has(rectKey)) groups.set(rectKey, []);
          groups.get(rectKey).push(spot);
        });

        const spots = [];
        groups.forEach(group => {
          const s = group[0];
          let marker;
          if (s.marker === "exit") {
            // Arrow in the walking direction; default: towards the nearer edge
            const ARROWS = { left: "◀", right: "▶", up: "▲", down: "▼" };
            const direction = s.direction || (s.x + s.w / 2 < args.width / 2 ? "left" : "right");
            const badge = el("rect", {
              class: "exit-badge", x: s.x, y: s.y + s.h / 2 - 9, width: s.w, height: 18, rx: 3 });
            overlay.appendChild(badge);
            const arrow = el("text", {
              class: "exit-arrow", x: s.x + s.w / 2, y: s.y + s.h / 2 + 4, "text-anchor": "middle" });
            arrow.textContent = ARROWS[direction] || "▶";
            overlay.appendChild(arrow);
            // Where the exit leads, shown on hover above the arrow
            const label = s.name ? addLabel({ ...s, y: s.y + s.h / 2 - 9 }, args.width) : null;
            marker = { classList: {
              add: c => { badge.classList.add(c); if (label) label.classList.add(c); },
              remove: c => { badge.classList.remove(c); if (label) label.classList.remove(c); },
            } };
          } else if (s.name) {
            marker = addLabel(s, args.width);
          }

          const rectEl = el("rect", { class: "spot", x: s.x, y: s.y, width: s.w, height: s.h });
          if (marker) {
            rectEl.addEventListener("mouseenter", () => marker.classList.add("hot"));
            rectEl.addEventListener("mouseleave", () => marker.classList.remove("hot"));
          }
          rectEl.addEventListener("click", e => {
            e.stopPropagation();
            if (busy) return;
            if (group.length === 1) activate(s);
            else showMenu(e, group);
          });
          spots.push(rectEl);
        });
        // Clickable areas go on top of the labels
        spots.forEach(rectEl => overlay.appendChild(rectEl));
      }

      // Keep the whole picture inside the browser window (wide layout)
      function fitToWindow() {
        let windowHeight = window.innerHeight;
        try { windowHeight = window.parent.innerHeight; } catch (e) { /* other origin */ }
        if (!args) return;
        const maxWidth = windowHeight * 0.7 * args.width / args.height;
        wrap.style.maxWidth = Math.round(maxWidth) + "px";
        wrap.style.margin = "0 auto";
        requestAnimationFrame(updateHeight);
      }
      try { window.parent.addEventListener("resize", fitToWindow); } catch (e) { /* ignore */ }

      function render(newArgs) {
        args = newArgs;
        fitToWindow();
        const sceneKey = JSON.stringify([args.svg, args.hotspots]);
        if (sceneKey !== lastScene) {
          lastScene = sceneKey;
          drawScene();
        }
        const message = args.message;
        if (!message) {
          endConversation();
          shownMessageId = null;
        } else if (message.id !== shownMessageId) {
          shownMessageId = message.id;
          startConversation(message);
        }
        requestAnimationFrame(updateHeight);
      }

      window.addEventListener("message", event => {
        if (event.data && event.data.type === "streamlit:render") {
          render(event.data.args);
        }
      });
      window.addEventListener("resize", updateHeight);
      send("streamlit:componentReady", { apiVersion: 1 });
    </script>
  </body>
</html>
